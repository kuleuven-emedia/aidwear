host_ip : "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null


logging_spec:
  stream_period_s     : 30

  stream_hdf5         : True
  stream_csv          : False
  stream_video        : False
  stream_audio        : False

  dump_csv            : False
  dump_hdf5           : False
  dump_video          : False
  dump_audio          : False

video_codec_config_filepath : null
audio_codec_config_filepath : null


producer_specs:
  - package: "aidwear_cli"
    class: "ProsthesisCliProducer"
    settings: {}


consumer_specs: []


pipeline_specs:
  - package: "aidwear"
    class: "ProsthesisPipeline"
    settings:
      stream_out_spec:
        dt: 0.01
        niclas:
          sampling_rate_hz: 50
          connection_type: "BLE"  # BLE or I2C
          device_mapping:  # for BLE connection type
            torso       : "B2:C9:23:6B:E0:C6"
            thigh_right : "AC:FB:DC:C8:F1:16"
            thigh_left  : "5C:3E:2C:04:28:85"
            shank_right : "27:6D:73:51:55:D9"
            shank_left  : "45:7B:E2:8D:B1:F6"
            # foot_right  : "C2:AE:CC:0B:C8:DE"
            # foot_left   : "1A:3D:6D:EF:68:45"
          service_uuid: "19b10000-0000-537e-4f6c-d104768a1214"
          char_uuid: "19b10000-1001-537e-4f6c-d104768a1214"
          # device_mapping:  # for I2C connection type
          #   torso:
          #     address: 0x11
          #     int_pin: 31
          #   thigh_right:
          #     address: 0x12
          #     int_pin: 11
          #   shank_right:
          #     address: 0x13
          #     int_pin: 13
          #   thigh_left:
          #     address: 0x14
          #     int_pin: 15
          #   shank_left:
          #     address: 0x15
          #     int_pin: 16
          is_acc    : False
          is_gyr    : True
          is_mag    : False
          is_euler  : True
          is_quat   : False
          is_temp   : False
          is_baro   : False
          is_hum    : False
        motors:
          is_emulate_can: False  # creates a virtual CAN bus for testing.
          sampling_rate_hz: 50
          device_mapping:
            knee:
              can_id: 1
              type: "AK10_9"
            ankle:
              can_id: 2
              type: "AK80_8"


      stream_in_specs:
        - package: "aidwear_cli"
          class: "ProsthesisCliProducer"
          settings: {}
