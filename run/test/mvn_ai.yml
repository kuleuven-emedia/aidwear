host_ip: "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null

logging_spec:
  stream_period_s: 30
  stream_hdf5: True

video_codec_config_filepath: null
audio_codec_config_filepath: null

producer_specs:
  - package: "xsens_replay"
    class: "ImuReplayProducer"
    node_id: "mvn"
    settings:
      file_path: "./dataset/mvn_016_1_1.hdf5"
      sampling_rate_hz: 60
      sensor_indices: null  # null selects all 17 sensors from dataset; or pass list of indices
      segment_indices: null # null selects all 23 segments from dataset; or pass list of indices
      is_loop: True
      buf_len: 3_000


consumer_specs:
  - package: "aidwear.visualizer"
    class: "VisualizerConsumer"
    node_id: "visualizer"
    settings:
      history_len: 150
      draw_interval_s: 0.04
      dark_mode: True
      data_in_specs:
        - package: "xsens_replay"
          class: "ImuReplayProducer"
          node_id: "mvn"
          topics:
            - "xsens_motion_trackers"
          settings:
            file_path: "./dataset/mvn_016_1_1.hdf5"
            sampling_rate_hz: 60
            sensor_indices: null
            segment_indices: null
            is_loop: True
            buf_len: 100

        - package: "aidwear.ai_intent"
          class: "IntentClassifierPipeline"
          node_id: "ai_intent"
          topics:
            - "intent"
          settings:
            buf_len: 100
            horizons: [0]
            classes:
              Level-Ground Walking: 0
              Hurdles: 1
              Stair Ascent: 2
              Stair Descent: 3
              Cross Country: 4
              Ladder: 5
              Slope Ascent: 6
              Slope Descent: 7
              Wobbly Steps: 8
              Step Over: 9
              Bench: 10
              Balance Beam: 11
              High-step": 12
            in_streams:
              - "mvn"


pipeline_specs:
  - package: "aidwear.ai_intent"
    class: "IntentClassifierPipeline"
    node_id: "ai_intent"
    settings:
      data_out_spec:
        config_path: "src/hermes/aidwear/ai_intent/utils/configs/cybathlon_dcl_acc_gyro.yml"
        device: "cpu"
        imu_type: "mvn"
        module_params:
          buf_len: 10_000
          prediction_horizons: [0]
          output_classes:
            Level-Ground Walking: 0
            Hurdles: 1
            Stair Ascent: 2
            Stair Descent: 3
            Cross Country: 4
            Ladder: 5
            Slope Ascent: 6
            Slope Descent: 7
            Wobbly Steps: 8
            Step Over: 9
            Bench: 10
            Balance Beam: 11
            High-step": 12
          input_features:
            raw_imu:
              num_features:
                - 180
                - 30
              dtype: "float32"
        modalities:
          raw_imu:
            mvn:
              buf_len: 300
              num_features:
                - 30
              dtype: "float32"

      data_in_specs:
        - package: "xsens_replay"
          class: "ImuReplayProducer"
          node_id: "mvn"
          topics:
            - "xsens_motion_trackers"
          settings:
            file_path: "./dataset/mvn_016_1_1.hdf5"
            sampling_rate_hz: 60
            sensor_indices: null  # null selects all 17 sensors from dataset; or pass list of indices
            segment_indices: null # null selects all 23 segments from dataset; or pass list of indices
            is_loop: True
            buf_len: 3_000
