pipeline_specs:
  - package: "revalexo.ai"
    class: "IntentClassifierPipeline"
    topic: "ai_intent"
    settings:
      stream_out_spec:
        config_path: "hermes/revalexo/ai/utils/configs/dcl_acc_gyro.yml"
        device: "cuda"
        gravity_scaling_factor: 4
        gyroscope_scaling_factor: 1000
        imu_type: "mvn"  # ["mvn", "nicla"]
        module_params:
          prediction_horizons: [0, 0.1, 0.2, 0.3, 0.5, 1]
          output_classes:
            Level ground walking: 0
            Sit to stand: 1
            Stand to sit: 2
            Sitting: 3
            Stair up: 4
            Stair down: 5
            Ramp up: 6
            Ramp down: 7
            Grass walking: 8
            Uneven ground walking: 9
            Carry: 10
          input_features:
            raw_imu:
              num_features:
                - 120
                - 42
              dtype: "float32"
        modalities:
          raw_imu:
            mvn:
              buf_len: 300
              num_features:
                - 42
              dtype: "float32"
            # pelvis:
            #   buf_len: 300
            #   num_features:
            #     - 6
            #   dtype: "float32"
            # thigh_right:
            #   buf_len: 300
