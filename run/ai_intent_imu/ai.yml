            #   dtype: "float32"
            # foot_left:
            #   buf_len: 300
            #   num_features:
            #     - 6
            #   dtype: "float32"

      stream_in_specs:
        - package: "mvn"
          class: "MvnAnalyzeProducer"
          topic: "mvn"
          settings:
            mvn_setup           : "lower_body"
            sampling_rate_hz    : 60
            is_euler            : True
            is_quaternion       : True
            is_joint_angles     : True
            is_linear_segments  : True
            is_angular_segments : True
            is_motion_trackers  : True
            is_com              : True
            is_time_code        : True

