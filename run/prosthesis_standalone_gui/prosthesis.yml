host_ip : "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null


logging_spec:
  stream_period_s     : 30

  stream_hdf5         : True
  stream_csv          : False
  stream_video        : False
  stream_audio        : False

  dump_csv            : False
  dump_hdf5           : False
  dump_video          : False
  dump_audio          : False

video_codec_config_filepath : null
audio_codec_config_filepath : null


producer_specs:
  - package: "revalexo.gui"
    class: "PhoneGuiProducer"
    topic: "gui_control"
    settings:
      phone_ip: "10.220.25.105"
      phone_port: 6000


consumer_specs: []


pipeline_specs:
  - package: "aidwear.prosthesis"
    class: "ProsthesisPipeline"
    topic: "prosthesis"
    settings:
      stream_out_spec:
        dt: 0.01
        niclas:
          sampling_rate_hz: 50
          connection_type: "BLE"  # BLE or I2C
          is_pelvis_and_feet: False
          device_mapping:  # for BLE connection type
            torso       : "D8:4E:18:CC:F6:62"
            thigh_right : "4D:8B:11:D5:F2:46"
            thigh_left  : "A3:2F:AF:84:4E:1D"
            shank_right : "96:CD:19:11:5B:F7"
            shank_left  : "D5:A0:BA:27:CA:09"
          service_uuid: "19b10000-0000-537e-4f6c-d104768a1214"
          char_uuid: "19b10000-1001-537e-4f6c-d104768a1214"
          # device_mapping:  # for I2C connection type
          #   torso:
          #     address: 0x11
          #     int_pin: 31
          #   thigh_right:
          #     address: 0x12
          #     int_pin: 11
          #   shank_right:
          #     address: 0x13
          #     int_pin: 13
          #   thigh_left:
          #     address: 0x14
          #     int_pin: 15
          #   shank_left:
          #     address: 0x15
          #     int_pin: 16
          is_acc    : True
          is_gyr    : True
          is_mag    : False
          is_euler  : True
          is_quat   : False
          is_temp   : False
          is_baro   : False
          is_hum    : False
        motors:
          is_emulate_can: False  # creates a virtual CAN bus for testing.
          sampling_rate_hz: 50
          device_mapping:
            knee_right:
              can_id: 1
              type: "AK10_9"
            hip_left:
              can_id: 2
              type: "AK80_8"
            hip_right:
              can_id: 3
              type: "AK80_8"
            knee_left:
              can_id: 4
              type: "AK10_9"
        pmu:
          id: 0x1804447D
          time_threshold: 0.05
          sampling_rate_hz: 50

      stream_in_specs:
        - package: "revalexo.gui"
          class: "PhoneGuiProducer"
          topic: "gui_control"
          settings:
            phone_ip: "10.220.25.105"
            phone_port: 6000
