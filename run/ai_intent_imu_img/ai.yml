                  White Balance temperature,Auto: 1
              right_eye:
                name: "Pupil Cam2 ID1"
                fps: 120
                resolution:
                  - 400
                  - 400
                  - 3
                bandwidth_factor: 1.0
                uvc_controls:
                  Auto Exposure Mode: 1
                  Auto Exposure Priority: 0
                  Absolute Exposure Time: 15
                  Auto Focus: 0
                  Absolute Focus: 1
                  Zoom absolute control: 0
                  Pan control: 0
