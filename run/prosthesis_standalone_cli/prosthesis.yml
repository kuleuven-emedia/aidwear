host_ip: "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null

logging_spec:
  stream_period_s: 30

  stream_hdf5: True
  stream_csv: False
  stream_video: False
  stream_audio: False

  dump_csv: False
  dump_hdf5: False
  dump_video: False
  dump_audio: False

video_codec_config_filepath: null
audio_codec_config_filepath: null

producer_specs:
  - package: "aidwear.cli"
    class: "CliProducer"
    node_id: "cli_control"
    settings:
      buf_len: 1000

consumer_specs: []

pipeline_specs:
  - package: "aidwear.prosthesis"
    class: "ProsthesisPipeline"
    node_id: "prosthesis"
    settings:
      data_out_spec:
        dt: 0.01
        base_assistance: 50.0
        is_immediate_mode_switch: False
        num_majority_vote: 5
        fsm_config_path: null # "run/fsm_config_default.yml"
        niclas:
          buf_len: 3000
          sampling_rate_hz: 50
          connection_type: "BLE" # BLE or I2C
          is_pelvis_and_feet: False
          device_mapping: # for BLE connection type
            torso: "B2:C9:23:6B:E0:C6"
            thigh_right: "AC:FB:DC:C8:F1:16"
            thigh_left: "5C:3E:2C:04:28:85"
            shank_right: "27:6D:73:51:55:D9"
            shank_left: "45:7B:E2:8D:B1:F6"
          service_uuid: "19b10000-0000-537e-4f6c-d104768a1214"
          char_uuid: "19b10000-1001-537e-4f6c-d104768a1214"
          gravity_scaling_factor: 4
          gyroscope_scaling_factor: 500
          is_acc: True
          is_gyr: True
          is_mag: False
          is_euler: True
          is_quat: False
          is_temp: False
          is_baro: False
          is_hum: False
        motors:
          is_emulate_can: False # creates a virtual CAN bus for testing.
          buf_len: 3000
          sampling_rate_hz: 50
          device_mapping:
            knee:
              can_id: 1
              type: "AK10_9"
            ankle:
              can_id: 2
              type: "AK80_8"

        pmu:
          id: 0x1804447D
          time_threshold: 0.05
          buf_len: 3000
          sampling_rate_hz: 50
        telemetry:
          buf_len: 30000

      data_in_specs:
        - package: "aidwear.cli"
          class: "CliProducer"
          node_id: "cli_control"
          topics:
            - "intent"
            - "fatigue"
            - "event"
            - "safety_stop"
          settings:
            buf_len: 1000
