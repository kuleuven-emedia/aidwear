host_ip : "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null


logging_spec:
  stream_period_s     : 30

  stream_hdf5         : True
  stream_csv          : False
  stream_video        : False
  stream_audio        : False

  dump_csv            : False
  dump_hdf5           : False
  dump_video          : False
  dump_audio          : False

video_codec_config_filepath : null
audio_codec_config_filepath : null


producer_specs:
  - package: "aidwear.cli"
    class: "CliProducer"
    node_id: "cli_control"
    settings: {}


consumer_specs: []


pipeline_specs:
  - package: "aidwear.prosthesis"
    class: "ProsthesisPipeline"
    node_id: "prosthesis"
    settings:
      data_out_spec:
        dt: 0.01
        niclas:
          buf_len: 3000
          sampling_rate_hz: 50
          connection_type: "BLE"  # BLE or I2C
          is_pelvis_and_feet: False
          device_mapping:  # for BLE connection type
            torso       : "D8:4E:18:CC:F6:62"
            thigh_right : "4D:8B:11:D5:F2:46"
            thigh_left  : "A3:2F:AF:84:4E:1D"
            shank_right : "96:CD:19:11:5B:F7"
            shank_left  : "D5:A0:BA:27:CA:09"
          service_uuid: "19b10000-0000-537e-4f6c-d104768a1214"
          char_uuid: "19b10000-1001-537e-4f6c-d104768a1214"
          is_acc    : True
          is_gyr    : True
          is_mag    : False
          is_euler  : True
          is_quat   : False
          is_temp   : False
          is_baro   : False
          is_hum    : False
        motors:
          is_emulate_can: True  # creates a virtual CAN bus for testing.
          buf_len: 3000
          sampling_rate_hz: 50
          device_mapping:
            knee:
              can_id: 1
              type: "AK10_9"
            ankle:
              can_id: 2
              type: "AK80_8"
        telemetry:
          buf_len: 100000


      data_in_specs:
        - package: "aidwear.cli"
          class: "CliProducer"
          node_id: "cli_control"
          topics:
            - "intent"
            - "safety_stop"
          settings:
            buf_len: 1000
