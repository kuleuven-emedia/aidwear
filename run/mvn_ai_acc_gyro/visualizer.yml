host_ip: "192.168.0.110"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips:
  - "192.168.0.102"  # prosthesis
connections:
  - ssh_username: "aidwear"
    ssh_host_ip: "192.168.0.102"
    platform: "Linux"
    pre_hook: "./run/prehook_prosthesis.sh"
    config_filepath: "./run/prosthesis_ai/prosthesis_with_ai.yml"
    project_dir: "~/aidwear"
    output_dir: "./data"

is_remote_kill: False
remote_kill_ip: null

logging_spec:
  stream_period_s: 60

video_codec_config_filepath: null
audio_codec_config_filepath: null

producer_specs:
  - package: "xsens_replay"
    class: "ImuReplayProducer"
    node_id: "mvn"
    settings:
      file_path: "./dataset/mvn_016_1_1.hdf5"
      sampling_rate_hz: 60
      sensor_indices: null  # null selects all 17 sensors from dataset; or pass list of indices
      segment_indices: null # null selects all 23 segments from dataset; or pass list of indices
      is_loop: True
      buf_len: 3_000

consumer_specs:
  - package: "aidwear.visualizer"
    class: "VisualizerConsumer"
    node_id: "visualizer"
    settings:
      history_len: 150
      draw_interval_s: 0.04
      dark_mode: True
      data_in_specs:
        - package: "xsens_replay"
          class: "ImuReplayProducer"
          node_id: "mvn"
          topics:
            - "xsens_motion_trackers"
          settings:
            file_path: "./dataset/mvn_016_1_1.hdf5"
            sampling_rate_hz: 60
            sensor_indices: null
            segment_indices: null
            is_loop: True
            buf_len: 100

        - package: "aidwear.ai_intent"
          class: "IntentClassifierPipeline"
          topic: "ai_intent"
          topics:
            - "intent"
          settings:
            buf_len: 100
            horizons: [0]
            classes:
              Level-Ground Walking: 0
              Hurdles: 1
              Stair Ascent: 2
              Stair Descent: 3
              Cross Country: 4
              Ladder: 5
              Slope Ascent: 6
              Slope Descent: 7
              Wobbly Steps: 8
              Step Over: 9
              Bench: 10
              Balance Beam: 11
              High-step": 12
            in_streams:
              - "mvn"

pipeline_specs: []
