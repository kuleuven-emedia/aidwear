host_ip: "192.168.0.110"
is_master_broker: True

remote_subscriber_ips:
  - "192.168.0.102"  # prosthesis receives AI commands
remote_publisher_ips:
  - "192.168.0.102"  # prosthesis sends telemetry data
connections:
  - ssh_username: "aidwear"
    ssh_host_ip: "192.168.0.102"
    platform: "Linux"
    pre_hook: "./run/prehook_prosthesis.sh"
    config_filepath: "./run/prosthesis_ai/prosthesis.yml"
    project_dir: "~/aidwear"
    output_dir: "./data"

is_remote_kill: False
remote_kill_ip: null

logging_spec:
  stream_period_s: 60

video_codec_config_filepath: null
audio_codec_config_filepath: null

producer_specs: []

consumer_specs:
  - package: "aidwear.visualizer"
    class: "VisualizerConsumer"
    node_id: "visualizer"
    settings:
      history_len: 150
      draw_interval_s: 0.04
      dark_mode: True
      data_in_specs:
        - package: "aidwear.prosthesis"
          class: "ProsthesisPipeline"
          node_id: "prosthesis"
          topics:
            - "telemetry.all"
          settings:
            niclas:
              buf_len: 100
              sampling_rate_hz: 90
              connection_type: "BLE"
              is_pelvis_and_feet: False
              device_mapping:
                torso: "D8:4E:18:CC:F6:62"
                thigh_right: "4D:8B:11:D5:F2:46"
                thigh_left: "A3:2F:AF:84:4E:1D"
                shank_right: "96:CD:19:11:5B:F7"
                shank_left: "D5:A0:BA:27:CA:09"
              gravity_scaling_factor: 4
              gyroscope_scaling_factor: 500
              is_acc: True
              is_gyr: True
              is_mag: False
              is_euler: True
              is_quat: False
              is_temp: False
              is_baro: False
              is_hum: False
            motors:
              device_mapping:
                knee:
                  can_id: 1
                ankle:
                  can_id: 2
              sampling_rate_hz: 100
              buf_len: 100
            telemetry:
              buf_len: 100

        - package: "aidwear.ai_intent"
          class: "IntentClassifierPipeline"
          topic: "ai_intent"
          topics:
            - "intent"
          settings:
            buf_len: 100
            horizons: [0]
            classes:
              Level-Ground Walking: 0
              Hurdles: 1
              Stair Ascent: 2
              Stair Descent: 3
              Cross Country: 4
              Ladder: 5
              Slope Ascent: 6
              Slope Descent: 7
              Wobbly Steps: 8
              Step Over: 9
              Bench: 10
              Balance Beam: 11
              High-step": 12
            in_streams:
              - "pelvis"
              - "thigh_right"
              - "thigh_left"
              - "shank_right"
              - "shank_left"
    logging_spec:
      stream_period_s: 60

pipeline_specs:
  - package: "aidwear.ai_intent"
    class: "IntentClassifierPipeline"
    topic: "ai_intent"
    settings:
      data_out_spec:
        config_path: "src/hermes/aidwear/ai_intent/utils/configs/cybathlon_dcl_acc_gyro.yml"
        device: "cuda"
        imu_type: "nicla"
        module_params:
          buf_len: 10_000
          prediction_horizons: [0]
          output_classes:
            Level-Ground Walking: 0
            Hurdles: 1
            Stair Ascent: 2
            Stair Descent: 3
            Cross Country: 4
            Ladder: 5
            Slope Ascent: 6
            Slope Descent: 7
            Wobbly Steps: 8
            Step Over: 9
            Bench: 10
            Balance Beam: 11
            High-step": 12
          input_features:
            raw_imu:
              num_features:
                - 180
                - 30
              dtype: "float32"
        modalities:
          raw_imu:
            pelvis:
              buf_len: 300
              num_features:
                - 6
              dtype: "float32"
            thigh_right:
              buf_len: 300
              num_features:
                - 6
              dtype: "float32"
            thigh_left:
              buf_len: 300
              num_features:
                - 6
              dtype: "float32"
            shank_right:
              buf_len: 300
              num_features:
                - 6
              dtype: "float32"
            shank_left:
              buf_len: 300
              num_features:
                - 6
              dtype: "float32"

      data_in_specs:
        - package: "aidwear.prosthesis"
          class: "ProsthesisPipeline"
          node_id: "prosthesis"
          topics:
            - "telemetry.nicla.all"
          settings:
            niclas:
              buf_len: 10_000
              sampling_rate_hz: 90
              connection_type: "BLE" # BLE or I2C
              is_pelvis_and_feet: False
              device_mapping:
                torso: "D8:4E:18:CC:F6:62"
                thigh_right: "4D:8B:11:D5:F2:46"
                thigh_left: "A3:2F:AF:84:4E:1D"
                shank_right: "96:CD:19:11:5B:F7"
                shank_left: "D5:A0:BA:27:CA:09"
              gravity_scaling_factor: 4
              gyroscope_scaling_factor: 500
              is_acc: True
              is_gyr: True
              is_mag: False
              is_euler: True
              is_quat: False
              is_temp: False
              is_baro: False
              is_hum: False
            motors:
              device_mapping:
                knee:
                  can_id: 1
                ankle:
                  can_id: 2
              sampling_rate_hz: 100
              buf_len: 10_000
            telemetry:
              buf_len: 1_000
